    url: https://github.com/TigerTag-Project/TigerTag-RFID-Guide/security/advisories/new
    about: No informes de una vulnerabilidad en una incidencia pública, especialmente si afecta a la firma TigerTag+, la gestión de claves o la verificación. Usa un aviso de seguridad privado.

  - name: 📄 Consultas sobre licencias
    url: https://github.com/TigerTag-Project/TigerTag-RFID-Guide/blob/main/LICENSING.md
