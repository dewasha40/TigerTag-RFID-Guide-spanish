name: Propuesta de protocolo (TEP)
description: Propón un cambio en la especificación del protocolo TigerTag
title: "[TEP] "
labels: ["tep", "draft"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por proponer una mejora para el protocolo TigerTag.

        **Las mejoras se presentan como propuestas, no como forks.** Esta especificación es la
        referencia oficial para más de dos millones de chips en circulación. Cualquier cambio
        afecta a todos los lectores que ya están en uso.

        Antes de empezar:
        - Las correcciones (erratas, valores hexadecimales incorrectos, enlaces rotos o errores en el código de ejemplo) **no** necesitan un TEP: abre una pull request.
        - **No** informes aquí de problemas de seguridad. Consulta [SECURITY.es.md](https://github.com/dewasha40/TigerTag-RFID-Guide-spanish/blob/main/SECURITY.es.md).
        - Las solicitudes para añadir una marca o un material a la base de referencia no son TEP; abre una incidencia normal.
        - Lee [CONTRIBUTING.es.md](https://github.com/dewasha40/TigerTag-RFID-Guide-spanish/blob/main/CONTRIBUTING.es.md) para saber cómo se tramita un TEP.

  - type: textarea
    id: problem
    attributes:
      label: El problema
      description: >
        ¿Qué no puedes hacer actualmente? Describe el problema antes que la solución. Si puedes,
        menciona un producto, flujo de trabajo o usuario real. Un TEP que explique mal un problema
        real es más útil que uno que proponga una solución elegante para algo que no es un problema.
      placeholder: |
        Nuestro laminador necesita conocer X para poder hacer Y. Actualmente el chip no permite
        expresarlo, así que usamos Z como alternativa, pero falla cuando...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: La propuesta
      description: ¿Qué debería cambiar exactamente? Especifica los campos, desplazamientos, codificaciones y el orden de los bytes.
      placeholder: |
        Add a u8 field at offset +NN (page 0xNN) encoding ... as ...
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: ¿Qué tipo de cambio es?
      options:
        - Campo nuevo en espacio reservado o sin usar
        - Cambio en el significado o la codificación de un campo existente
        - Cambio en el desplazamiento o la distribución de memoria
        - Cambio en la firma o el proceso de verificación
        - Nueva versión del formato de etiqueta
        - Documentación del comportamiento existente (sin cambios en el protocolo)
        - Otro
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibilidad con versiones anteriores
      description: >
        **Esta es la pregunta clave en casi todos los TEP.** ¿Qué hará un lector existente cuando
        encuentre un chip escrito según tu propuesta? Si la respuesta es «funcionará mal», tu
        propuesta necesita una nueva versión del formato de etiqueta, no un campo nuevo. Indícalo:
        es una respuesta válida y no descalifica la propuesta.
      placeholder: |
        Un lector v2.1 existente que encuentre un chip escrito según esta propuesta...
        Los chips escritos antes de este cambio todavía...
    validations:
      required: true

  - type: input
    id: memory
    attributes:
      label: Coste de memoria
      description: >
        ¿Cuántos bytes ocupará en el chip? El NTAG213 dispone de 144 bytes útiles y el espacio es
        el recurso más limitado del proyecto. Si necesitas 4 bytes, explica por qué no bastan 2.
      placeholder: "2 bytes en el desplazamiento +NN: se necesita un u16 BE porque..."
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Requisitos fundamentales
      description: Se rechazará cualquier TEP que incumpla alguno de estos requisitos. Confírmalos.
      options:
        - label: Este cambio funciona **completamente sin conexión**: no requiere acceso a la red para leer ni verificar un chip.
          required: true
        - label: Este cambio **no debilita la firma TigerTag+** ni su verificación.
          required: true
        - label: **Cualquier persona** puede implementar este cambio sin permiso de TigerTag Corp.
          required: true
        - label: Este cambio **no duplica** información que ya esté en el chip o pueda obtenerse mediante la API pública.
          required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: ¿Qué otras opciones has probado y por qué es mejor esta? «Ninguna» también es una respuesta válida.
    validations:
      required: false

  - type: textarea
    id: implementation
    attributes:
      label: Experiencia de implementación
      description: >
        ¿Has creado un prototipo? Una implementación funcional, una lectura de memoria del chip o
        un lector modificado aumentan mucho las posibilidades de aceptar el TEP. Añade un enlace si dispones de ello.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        Al abrir esta propuesta, aceptas que cualquier texto de especificación que aportes se
        publique bajo `CC-BY-4.0` y cualquier código bajo `Apache-2.0`, según se explica en
        [LICENSING.es.md](https://github.com/dewasha40/TigerTag-RFID-Guide-spanish/blob/main/LICENSING.es.md).
        Conservas los derechos de autor. No se requiere un CLA.
